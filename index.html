<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador de Héroes ⚡</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a12;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .container {
            max-width: 420px;
            margin: auto;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #7928ca;
        }

        /* Campo Nombre */
        .input-name {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #333;
            background: #161626;
            color: #fff;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            outline: none;
        }

        .input-name:focus {
            border-color: #ff007f;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        /* Escenario del Personaje */
        .character-stage {
            position: relative;
            width: 300px;
            height: 360px;
            margin: 0 auto 15px auto;
            background: radial-gradient(circle, #1f1f3a 0%, #0d0d1a 100%);
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(121, 40, 202, 0.3);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Nombre del Héroe */
        .hero-title {
            position: absolute;
            top: 15px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f2fe;
            text-shadow: 0 0 8px #00f2fe;
            z-index: 20;
        }

        /* Silueta Humanoide Base */
        .base-mannequin {
            width: 140px;
            height: 250px;
            z-index: 5;
            position: relative;
        }

        /* CAPAS DE EFECTOS Y PODERES */
        .power-element {
            position: absolute;
            display: none; /* Se activa con JS */
            pointer-events: none;
        }

        /* 1. Aura Saiyajin */
        #p-aura {
            width: 260px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.6) 0%, rgba(255,100,0,0.2) 60%, rgba(0,0,0,0) 80%);
            box-shadow: 0 0 30px #ffcc00;
            z-index: 2;
            animation: pulseGlow 0.8s infinite alternate;
        }

        /* 2. Sentido Arácnido */
        #p-spider-sense {
            top: 45px;
            width: 120px;
            height: 50px;
            z-index: 10;
            animation: flash 0.6s infinite alternate;
        }

        /* 3. Ojos Sharingan */
        #p-sharingan {
            top: 88px;
            width: 40px;
            height: 10px;
            z-index: 12;
            display: none;
            justify-content: space-between;
        }
        .sharingan-dot {
            width: 8px;
            height: 8px;
            background: red;
            border-radius: 50%;
            box-shadow: 0 0 6px red;
        }

        /* 4. Guantelete del Infinito (Mano Derecha) */
        #p-gauntlet {
            bottom: 110px;
            right: 50px;
            width: 25px;
            height: 35px;
            background: gold;
            border-radius: 4px;
            box-shadow: 0 0 12px gold;
            z-index: 11;
            border: 2px solid #ffaa00;
        }

        /* 5. Sable de Luz (Mano Izquierda) */
        #p-lightsaber {
            bottom: 100px;
            left: 45px;
            width: 6px;
            height: 110px;
            background: #00f2fe;
            box-shadow: 0 0 12px #00f2fe, 0 0 25px #00f2fe;
            transform: rotate(-25deg);
            z-index: 11;
            border-radius: 3px;
        }

        /* 6. Máscara Batman */
        #p-batman {
            top: 68px;
            width: 50px;
            height: 35px;
            z-index: 13;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.96); opacity: 0.7; }
            100% { transform: scale(1.04); opacity: 1; }
        }

        @keyframes flash {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Botones y Ficha */
        .btn-spin {
            width: 100%;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            margin-bottom: 15px;
        }

        .btn-spin:active { transform: scale(0.98); }

        .btn-copy {
            width: 100%;
            background: #00c853;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
        }

        .powers-card {
            background: #121222;
            border-radius: 15px;
            padding: 15px;
            text-align: left;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .powers-card h3 {
            font-size: 15px;
            margin-bottom: 10px;
            color: #aaa;
        }

        .powers-list {
            list-style: none;
            max-height: 150px;
            overflow-y: auto;
        }

        .powers-list li {
            background: #1a1a3a;
            margin-bottom: 6px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            border-left: 3px solid #ff007f;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ Creador de Héroes ⚡</h1>
    
    <input type="text" id="heroName" class="input-name" placeholder="Escribe tu nombre..." value="David" oninput="actualizarNombre()">

    <!-- Escenario del Personaje -->
    <div class="character-stage">
        <div id="heroTitle" class="hero-title">DAVID</div>

        <!-- Capas de Poderes (Vectoriales y Limpias) -->
        <div id="p-aura" class="power-element"></div>
        
        <!-- Sentido Arácnido (Líneas vectoriales) -->
        <svg id="p-spider-sense" class="power-element" viewBox="0 0 100 40">
            <path d="M 10 30 L 30 10 M 50 25 L 50 0 M 90 30 L 70 10" stroke="#ff0055" stroke-width="4" stroke-linecap="round"/>
        </svg>

        <!-- Ojos Sharingan -->
        <div id="p-sharingan" class="power-element">
            <div class="sharingan-dot"></div>
            <div class="sharingan-dot"></div>
        </div>

        <!-- Máscara de Batman -->
        <svg id="p-batman" class="power-element" viewBox="0 0 60 40">
            <path d="M 10 30 Q 30 40 50 30 L 55 5 L 40 18 L 30 10 L 20 18 L 5 5 Z" fill="#111" stroke="#333" stroke-width="1"/>
        </svg>

        <!-- Guantelete -->
        <div id="p-gauntlet" class="power-element"></div>

        <!-- Sable de Luz -->
        <div id="p-lightsaber" class="power-element"></div>

        <!-- Silueta Humanoide Base (Gris) -->
        <svg class="base-mannequin" viewBox="0 0 100 200" fill="#4a4a5e">
            <!-- Cabeza -->
            <circle cx="50" cy="30" r="16" />
            <!-- Cuello -->
            <rect x="47" y="46" width="6" height="8" />
            <!-- Torso -->
            <path d="M 28,54 L 72,54 L 63,115 L 37,115 Z" />
            <!-- Brazo Izquierdo -->
            <path d="M 25,54 L 12,105 L 20,107 L 30,60 Z" />
            <!-- Brazo Derecho -->
            <path d="M 75,54 L 88,105 L 80,107 L 70,60 Z" />
            <!-- Piernas -->
            <rect x="37" y="117" width="10" height="65" rx="3" />
            <rect x="53" y="117" width="10" height="65" rx="3" />
        </svg>
    </div>

    <button class="btn-spin" onclick="girarRuleta()">🎲 Girar Ruleta de Poderes</button>

    <div class="powers-card">
        <h3>Poderes y Habilidades Equipadas:</h3>
        <ul id="listaPoderes" class="powers-list">
            <li><em>Estado Base (Sin poderes)</em></li>
        </ul>
        <button class="btn-copy" onclick="copiarParaIA()">📋 Copiar Ficha para el Combate IA</button>
    </div>
</div>

<script>
    const poderesBanco = [
        { id: "p-aura", nombre: "🔥 Aura Super Saiyajin (Dragon Ball)" },
        { id: "p-spider-sense", nombre: "🕷️ Sentido Arácnido (Spider-Man)" },
        { id: "p-sharingan", nombre: "👁️ Sharingan / Ojos Místicos (Naruto)" },
        { id: "p-batman", nombre: "🦇 Máscara / Capucha de Héroe (Batman)" },
        { id: "p-gauntlet", nombre: "💎 Guantelete del Infinito (Marvel)" },
        { id: "p-lightsaber", nombre: "⚔️ Sable de Luz Neón (Star Wars)" }
    ];

    let poderesEquipados = [];

    function actualizarNombre() {
        const nombre = document.getElementById('heroName').value.trim();
        document.getElementById('heroTitle').innerText = nombre ? nombre.toUpperCase() : 'HÉROE';
    }

    function girarRuleta() {
        if (poderesEquipados.length >= poderesBanco.length) {
            return;
        }

        let poderNovedoso = null;

        // Selección limpia sin alertas
        while (!poderNovedoso) {
            const candidato = poderesBanco[Math.floor(Math.random() * poderesBanco.length)];
            if (!poderesEquipados.some(p => p.id === candidato.id)) {
                poderNovedoso = candidato;
            }
        }

        poderesEquipados.push(poderNovedoso);
        
        // Activar visibilidad del elemento gráfico
        const el = document.getElementById(poderNovedoso.id);
        if (el) {
            if (poderNovedoso.id === "p-sharingan") {
                el.style.display = 'flex';
            } else {
                el.style.display = 'block';
            }
        }

        renderizarLista();
    }

    function renderizarLista() {
        const ul = document.getElementById('listaPoderes');
        ul.innerHTML = poderesEquipados.map(p => `<li>${p.nombre}</li>`).join('');
    }

    function copiarParaIA() {
        const nombre = document.getElementById('heroName').value || "Héroe";
        const lista = poderesEquipados.map(p => `- ${p.nombre}`).join('\n');
        
        if (poderesEquipados.length === 0) {
            alert("¡Gira la ruleta primero!");
            return;
        }

        const textoFinal = `Ficha de Personaje:\nNombre: ${nombre}\nPoderes y Equipamiento:\n${lista}`;

        navigator.clipboard.writeText(textoFinal).then(() => {
            alert("¡Ficha copiada! Pégala en el chat con la IA para iniciar el combate.");
        });
    }
</script>

</body>
</html>
