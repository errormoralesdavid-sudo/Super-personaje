<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador de Héroes ⚡</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a12;
            color: white;
            text-align: center;
            padding: 15px;
            padding-bottom: 50px;
        }

        .container {
            max-width: 420px;
            margin: auto;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #7928ca;
        }

        .input-name {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #333;
            background: #161626;
            color: #fff;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            outline: none;
        }

        /* Escenario */
        .character-stage {
            position: relative;
            width: 300px;
            height: 360px;
            margin: 0 auto 15px auto;
            background: radial-gradient(circle, #1f1f3a 0%, #0d0d1a 100%);
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(121, 40, 202, 0.3);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-title {
            position: absolute;
            top: 15px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f2fe;
            text-shadow: 0 0 8px #00f2fe;
            z-index: 30;
        }

        .base-mannequin {
            width: 140px;
            height: 250px;
            z-index: 5;
        }

        /* Capas de Imágenes Dinámicas */
        .custom-item {
            position: absolute;
            display: none;
            pointer-events: none;
            z-index: 10;
        }

        /* Botones principales */
        .btn-spin {
            width: 100%;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            margin-bottom: 15px;
        }

        .btn-copy {
            width: 100%;
            background: #00c853;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
        }

        .powers-card {
            background: #121222;
            border-radius: 15px;
            padding: 15px;
            text-align: left;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .powers-list {
            list-style: none;
            max-height: 150px;
            overflow-y: auto;
        }

        .powers-list li {
            background: #1a1a3a;
            margin-bottom: 6px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            border-left: 3px solid #ff007f;
        }

        /* BOTÓN SECRETO ADMIN */
        .secret-trigger {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 40px;
            height: 40px;
            background: transparent;
            z-index: 999;
        }

        /* PANEL ADMIN OCULTO */
        .admin-panel {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111122;
            border-top: 2px solid #ff007f;
            padding: 15px;
            z-index: 1000;
            text-align: left;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.8);
            max-height: 80vh;
            overflow-y: auto;
        }

        .admin-panel h3 {
            font-size: 16px;
            color: #ff007f;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .admin-group {
            margin-bottom: 10px;
        }

        .admin-group label {
            display: block;
            font-size: 12px;
            color: #ccc;
            margin-bottom: 3px;
        }

        .admin-group select, .admin-group input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #222238;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .controls-grid div {
            display: flex;
            flex-direction: column;
        }

        .controls-grid input[type="range"] {
            width: 100%;
        }

        .btn-close-admin {
            background: #ff0055;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ Creador de Héroes ⚡</h1>
    
    <input type="text" id="heroName" class="input-name" placeholder="Nombre..." value="David" oninput="actualizarNombre()">

    <!-- Escenario del Personaje -->
    <div class="character-stage">
        <div id="heroTitle" class="hero-title">DAVID</div>

        <!-- Capas de Objetos Personalizables (Aura, Cabeza, Mano Der, Mano Izq, Espalda) -->
        <img id="item-aura" class="custom-item" alt="Aura">
        <img id="item-cabeza" class="custom-item" alt="Cabeza">
        <img id="item-manoder" class="custom-item" alt="Mano Derecha">
        <img id="item-manoizq" class="custom-item" alt="Mano Izquierda">
        <img id="item-espalda" class="custom-item" alt="Espalda">

        <!-- Silueta Humanoide Base -->
        <svg class="base-mannequin" viewBox="0 0 100 200" fill="#4a4a5e">
            <circle cx="50" cy="30" r="16" />
            <rect x="47" y="46" width="6" height="8" />
            <path d="M 28,54 L 72,54 L 63,115 L 37,115 Z" />
            <path d="M 25,54 L 12,105 L 20,107 L 30,60 Z" />
            <path d="M 75,54 L 88,105 L 80,107 L 70,60 Z" />
            <rect x="37" y="117" width="10" height="65" rx="3" />
            <rect x="53" y="117" width="10" height="65" rx="3" />
        </svg>
    </div>

    <button class="btn-spin" onclick="girarRuleta()">🎲 Girar Ruleta de Poderes</button>

    <div class="powers-card">
        <h3>Poderes y Equipamiento:</h3>
        <ul id="listaPoderes" class="powers-list">
            <li><em>Estado Base (Sin poderes)</em></li>
        </ul>
        <button class="btn-copy" onclick="copiarParaIA()">📋 Copiar Ficha para el Combate IA</button>
    </div>
</div>

<!-- Esquina Secreta (Botón transparente abajo a la izquierda) -->
<div class="secret-trigger" onclick="toggleAdmin()"></div>

<!-- Panel de Administración Oculto -->
<div id="adminPanel" class="admin-panel">
    <h3>⚙️ Panel Admin de Posicionamiento <button class="btn-close-admin" onclick="toggleAdmin()">X</button></h3>
    
    <div class="admin-group">
        <label>1. Selecciona la Capa / Ranura:</label>
        <select id="selectSlot" onchange="cargarConfiguracion()">
            <option value="item-aura">🔥 Aura / Fondo</option>
            <option value="item-cabeza">🪖 Cabeza / Máscara / Ojos</option>
            <option value="item-manoder">💎 Mano Derecha (Ej. Guantelete)</option>
            <option value="item-manoizq">⚔️ Mano Izquierda (Ej. Sable/Espada)</option>
            <option value="item-espalda">🦇 Espalda / Alas</option>
        </select>
    </div>

    <div class="admin-group">
        <label>2. Cargar Imagen desde el Teléfono (PNG Transparente):</label>
        <input type="file" accept="image/*" onchange="cargarImagenSlot(event)">
    </div>

    <div class="controls-grid">
        <div>
            <label>Posición Horizontal (X):</label>
            <input type="range" id="posX" min="0" max="250" value="100" oninput="ajustarPosicion()">
        </div>
        <div>
            <label>Posición Vertical (Y):</label>
            <input type="range" id="posY" min="0" max="300" value="100" oninput="ajustarPosicion()">
        </div>
        <div>
            <label>Tamaño / Ancho (px):</label>
            <input type="range" id="sizeW" min="20" max="320" value="80" oninput="ajustarPosicion()">
        </div>
        <div>
            <label>Capa de Profundidad (Z-Index):</label>
            <input type="range" id="posZ" min="1" max="20" value="10" oninput="ajustarPosicion()">
        </div>
    </div>
</div>

<script>
    // Estructura de Poderes asociables
    const poderesBanco = [
        { slot: "item-aura", nombre: "🔥 Aura de Fuego / Energía" },
        { slot: "item-cabeza", nombre: "🪖 Casco / Máscara / Ojos Místicos" },
        { slot: "item-manoder", nombre: "💎 Arma / Artefacto Mano Derecha" },
        { slot: "item-manoizq", nombre: "⚔️ Espada / Sable Mano Izquierda" },
        { slot: "item-espalda", nombre: "🦇 Alas / Capa de Espalda" }
    ];

    let poderesEquipados = [];

    // Ajustes guardados para cada capa
    let configCapas = {
        'item-aura': { x: 20, y: 20, w: 260, z: 2 },
        'item-cabeza': { x: 115, y: 55, w: 70, z: 15 },
        'item-manoder': { x: 195, y: 150, w: 50, z: 12 },
        'item-manoizq': { x: 45, y: 140, w: 50, z: 12 },
        'item-espalda': { x: 50, y: 70, w: 200, z: 1 }
    };

    function actualizarNombre() {
        const nombre = document.getElementById('heroName').value.trim();
        document.getElementById('heroTitle').innerText = nombre ? nombre.toUpperCase() : 'HÉROE';
    }

    function toggleAdmin() {
        const panel = document.getElementById('adminPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        if(panel.style.display === 'block') cargarConfiguracion();
    }

    function cargarImagenSlot(event) {
        const slotId = document.getElementById('selectSlot').value;
        const imgEl = document.getElementById(slotId);
        const file = event.target.files[0];
        
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imgEl.src = e.target.result;
                imgEl.style.display = 'block'; // Hacerlo visible
                aplicarEstilosSlot(slotId);
            }
            reader.readAsDataURL(file);
        }
    }

    function ajustarPosicion() {
        const slotId = document.getElementById('selectSlot').value;
        configCapas[slotId].x = document.getElementById('posX').value;
        configCapas[slotId].y = document.getElementById('posY').value;
        configCapas[slotId].w = document.getElementById('sizeW').value;
        configCapas[slotId].z = document.getElementById('posZ').value;

        aplicarEstilosSlot(slotId);
    }

    function aplicarEstilosSlot(slotId) {
        const imgEl = document.getElementById(slotId);
        const cfg = configCapas[slotId];
        
        imgEl.style.left = cfg.x + 'px';
        imgEl.style.top = cfg.y + 'px';
        imgEl.style.width = cfg.w + 'px';
        imgEl.style.zIndex = cfg.z;
    }

    function cargarConfiguracion() {
        const slotId = document.getElementById('selectSlot').value;
        const cfg = configCapas[slotId];

        document.getElementById('posX').value = cfg.x;
        document.getElementById('posY').value = cfg.y;
        document.getElementById('sizeW').value = cfg.w;
        document.getElementById('posZ').value = cfg.z;
    }

    function girarRuleta() {
        if (poderesEquipados.length >= poderesBanco.length) return;

        let poderNovedoso = null;

        while (!poderNovedoso) {
            const candidato = poderesBanco[Math.floor(Math.random() * poderesBanco.length)];
            if (!poderesEquipados.some(p => p.slot === candidato.slot)) {
                poderNovedoso = candidato;
            }
        }

        poderesEquipados.push(poderNovedoso);

        // Si tiene imagen asignada en ese slot, mostrarla
        const imgEl = document.getElementById(poderNovedoso.slot);
        if (imgEl && imgEl.src) {
            imgEl.style.display = 'block';
            aplicarEstilosSlot(poderNovedoso.slot);
        }

        renderizarLista();
    }

    function renderizarLista() {
        const ul = document.getElementById('listaPoderes');
        ul.innerHTML = poderesEquipados.map(p => `<li>${p.nombre}</li>`).join('');
    }

    function copiarParaIA() {
        const nombre = document.getElementById('heroName').value || "Héroe";
        const lista = poderesEquipados.map(p => `- ${p.nombre}`).join('\n');
        
        if (poderesEquipados.length === 0) {
            alert("¡Gira la ruleta primero!");
            return;
        }

        const textoFinal = `Ficha de Personaje:\nNombre: ${nombre}\nPoderes:\n${lista}`;

        navigator.clipboard.writeText(textoFinal).then(() => {
            alert("¡Ficha copiada! Pégala en la IA para simular la batalla.");
        });
    }
</script>

</body>
</html>
