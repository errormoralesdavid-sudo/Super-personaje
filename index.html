<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador de Héroes ⚡</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a12;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .container {
            max-width: 420px;
            margin: auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #7928ca;
        }

        /* Campo Nombre */
        .input-name {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #333;
            background: #161626;
            color: #fff;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            outline: none;
        }

        .input-name:focus {
            border-color: #ff007f;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        /* Escenario del Personaje */
        .character-stage {
            position: relative;
            width: 300px;
            height: 380px;
            margin: 0 auto 15px auto;
            background: radial-gradient(circle, #1f1f3a 0%, #0d0d1a 100%);
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(121, 40, 202, 0.3);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Nombre del Héroe */
        .hero-title {
            position: absolute;
            top: 15px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f2fe;
            text-shadow: 0 0 8px #00f2fe;
            z-index: 20;
        }

        /* Silueta Humanoide Base */
        .base-mannequin {
            width: 150px;
            height: 270px;
            z-index: 5;
            filter: drop-shadow(0 0 8px rgba(0,0,0,0.9));
        }

        /* IMÁGENES PNG SOBREPUESTAS */
        .img-layer {
            position: absolute;
            pointer-events: none;
            display: none; /* Se activan dinámicamente */
        }

        /* Posiciones exactas para cada accesorio/poder */
        #img-spider-sense {
            width: 130px;
            top: 40px;
            z-index: 10;
            animation: pulse 1s infinite alternate;
        }

        #img-infinity-gauntlet {
            width: 65px;
            bottom: 110px;
            right: 42px;
            z-index: 12;
            transform: rotate(-10deg);
        }

        #img-lightsaber {
            width: 70px;
            bottom: 100px;
            left: 30px;
            z-index: 12;
            transform: rotate(-20deg);
        }

        #img-ssj-aura {
            width: 280px;
            height: 350px;
            z-index: 2;
            opacity: 0.85;
            animation: glow 0.8s infinite alternate;
        }

        #img-batman-mask {
            width: 70px;
            top: 60px;
            z-index: 15;
        }

        #img-sharingan {
            width: 45px;
            top: 73px;
            z-index: 16;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.05); }
        }

        @keyframes glow {
            0% { filter: drop-shadow(0 0 5px gold); }
            100% { filter: drop-shadow(0 0 20px gold); }
        }

        /* Botones y Ficha */
        .btn-spin {
            width: 100%;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            margin-bottom: 15px;
        }

        .btn-spin:active { transform: scale(0.98); }

        .btn-copy {
            width: 100%;
            background: #00c853;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
        }

        .powers-card {
            background: #121222;
            border-radius: 15px;
            padding: 15px;
            text-align: left;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .powers-card h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #aaa;
        }

        .powers-list {
            list-style: none;
            max-height: 150px;
            overflow-y: auto;
        }

        .powers-list li {
            background: #1a1a3a;
            margin-bottom: 6px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            border-left: 3px solid #ff007f;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ Creador de Héroes ⚡</h1>
    
    <input type="text" id="heroName" class="input-name" placeholder="Nombre del personaje..." value="David" oninput="actualizarNombre()">

    <!-- Escenario del Personaje -->
    <div class="character-stage">
        <div id="heroTitle" class="hero-title">DAVID</div>

        <!-- Capas de Imágenes Transparentes PNG -->
        <img id="img-ssj-aura" class="img-layer" src="https://pngimg.com/uploads/fire/fire_PNG8935.png" alt="Aura">
        <img id="img-spider-sense" class="img-layer" src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Lightning_Flash_Icon.svg/512px-Lightning_Flash_Icon.svg.png" alt="Sentido Arácnido">
        <img id="img-sharingan" class="img-layer" src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Sharingan_triple.svg/512px-Sharingan_triple.svg.png" alt="Sharingan">
        <img id="img-batman-mask" class="img-layer" src="https://pngimg.com/uploads/batman/batman_PNG48.png" alt="Máscara">
        <img id="img-infinity-gauntlet" class="img-layer" src="https://pngimg.com/uploads/glove/glove_PNG82.png" alt="Guantelete">
        <img id="img-lightsaber" class="img-layer" src="https://pngimg.com/uploads/sword/sword_PNG5526.png" alt="Sable de Luz">

        <!-- Silueta Base -->
        <svg class="base-mannequin" viewBox="0 0 100 200" fill="#3a3a4a">
            <circle cx="50" cy="30" r="18" />
            <rect x="46" y="48" width="8" height="10" />
            <path d="M 25,58 L 75,58 L 65,120 L 35,120 Z" />
            <path d="M 22,58 L 10,110 L 18,112 L 28,65 Z" />
            <path d="M 78,58 L 90,110 L 82,112 L 72,65 Z" />
            <rect x="36" y="122" width="11" height="65" rx="4" />
            <rect x="53" y="122" width="11" height="65" rx="4" />
        </svg>
    </div>

    <button class="btn-spin" onclick="girarRuleta()">🎲 Girar Ruleta de Poderes</button>

    <div class="powers-card">
        <h3>Poderes y Habilidades Equipadas:</h3>
        <ul id="listaPoderes" class="powers-list">
            <li><em>Estado Base (Sin poderes)</em></li>
        </ul>
        <button class="btn-copy" onclick="copiarParaIA()">📋 Copiar Ficha para el Combate IA</button>
    </div>
</div>

<script>
    const poderesBanco = [
        { id: "img-spider-sense", nombre: "🕷️ Sentido Arácnido (Spider-Man)" },
        { id: "img-infinity-gauntlet", nombre: "💎 Guantelete del Infinito (Marvel)" },
        { id: "img-lightsaber", nombre: "⚔️ Sable de Luz / Espada mística" },
        { id: "img-ssj-aura", nombre: "🔥 Aura de Fuego / Super Saiyajin" },
        { id: "img-batman-mask", nombre: "🦇 Máscara de Héroe / Batman" },
        { id: "img-sharingan", nombre: "👁️ Ojo Místico / Sharingan" }
    ];

    let poderesEquipados = [];

    function actualizarNombre() {
        const nombre = document.getElementById('heroName').value.trim();
        document.getElementById('heroTitle').innerText = nombre ? nombre.toUpperCase() : 'HÉROE';
    }

    function girarRuleta() {
        // Si ya tiene todos los poderes, avisar
        if (poderesEquipados.length >= poderesBanco.length) {
            return;
        }

        let poderNovedoso = null;

        // Bucle automático que busca un poder SIN mostrar notificaciones molestas
        while (!poderNovedoso) {
            const candidato = poderesBanco[Math.floor(Math.random() * poderesBanco.length)];
            if (!poderesEquipados.some(p => p.id === candidato.id)) {
                poderNovedoso = candidato;
            }
        }

        // Agregar poder
        poderesEquipados.push(poderNovedoso);
        
        // Mostrar imagen correspondiente en el personaje
        const imgEl = document.getElementById(poderNovedoso.id);
        if (imgEl) {
            imgEl.style.display = 'block';
        }

        renderizarLista();
    }

    function renderizarLista() {
        const ul = document.getElementById('listaPoderes');
        ul.innerHTML = poderesEquipados.map(p => `<li>${p.nombre}</li>`).join('');
    }

    function copiarParaIA() {
        const nombre = document.getElementById('heroName').value || "Héroe";
        const lista = poderesEquipados.map(p => `- ${p.nombre}`).join('\n');
        
        if (poderesEquipados.length === 0) {
            alert("¡Gira la ruleta primero!");
            return;
        }

        const textoFinal = `Ficha de Personaje:\nNombre: ${nombre}\nPoderes:\n${lista}`;

        navigator.clipboard.writeText(textoFinal).then(() => {
            alert("¡Ficha copiada! Pégala en la IA para simular el combate.");
        });
    }
</script>

</body>
</html>
